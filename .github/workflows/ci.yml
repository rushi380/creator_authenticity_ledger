name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & Type-check ────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint "src/**/*.{ts,tsx}" --report-unused-disable-directives --max-warnings 0

      - name: Run TypeScript type-check
        run: npm run typecheck

  # ── Job 2: Test suite ───────────────────────────────────────────────────────
  test:
    name: Contract Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            coverage/
          if-no-files-found: ignore

  # ── Job 3: Compact contract check ──────────────────────────────────────────
  contract-check:
    name: Compact Contract Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify contract file exists
        run: |
          echo "Checking Compact contract..."
          if [ -f "contracts/creator_authenticity.compact" ]; then
            echo "✅ Contract file found"
            wc -l contracts/creator_authenticity.compact
          else
            echo "❌ Contract file missing"
            exit 1
          fi

      - name: Check Compact toolchain availability
        run: node scripts/compile-check.cjs

      - name: Attempt Compact compilation (if toolchain available)
        run: |
          if command -v compact &> /dev/null; then
            echo "Compact compiler found — compiling..."
            compact compile contracts/creator_authenticity.compact ./managed
            echo "✅ Compilation successful"
            ls -la managed/
          else
            echo "⚠️  Compact compiler not in PATH (expected in CI)"
            echo "Using committed managed/ artifacts"
            ls -la managed/ || echo "managed/ empty — needs local compile"
          fi

  # ── Job 4: Frontend build ───────────────────────────────────────────────────
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    env:
      VITE_NETWORK: preview
      VITE_CONTRACT_ADDRESS: ${{ secrets.VITE_CONTRACT_ADDRESS }}
      VITE_PROOF_SERVER_URL: http://localhost:6300
      VITE_MIN_ENGAGEMENT_BPS: '300'
      VITE_MIN_CONSISTENCY: '60'
      VITE_MIN_AUDIENCE_SCORE: '70'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── Job 5: Full CI gate ─────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate (All checks passed)
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, contract-check, build]
    steps:
      - name: All checks passed
        run: |
          echo "✅ Lint:           PASSED"
          echo "✅ Type-check:     PASSED"
          echo "✅ Tests:          PASSED"
          echo "✅ Contract check: PASSED"
          echo "✅ Build:          PASSED"
          echo ""
          echo "Creator Authenticity Ledger CI — ALL GREEN"
